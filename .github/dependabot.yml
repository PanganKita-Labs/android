
version: 2

# Monthly routine updates only.
# Security updates are handled separately.

multi-ecosystem-groups:
  pangankita-routine:
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: monthly
      time: "04:00"
      timezone: Etc/UTC

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: pangankita-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor

  - package-ecosystem: pub
    directory: /app
    patterns:
      - "*"
    multi-ecosystem-group: pangankita-routine
    rebase-strategy: disabled
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
