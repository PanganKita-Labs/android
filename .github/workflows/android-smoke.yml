name: Android Launch Smoke

on:
  schedule:
    # Weekly Monday 02:30 WIB (Sunday 19:30 UTC); limits emulator CI cost.
    - cron: '30 19 * * 0'
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Protect Android runtime compatibility on relevant PRs. Keep docs-only
    # and unrelated tooling and documentation-only changes off the matrix.
    paths:
      - '.github/workflows/android-smoke.yml'
      - '.github/scripts/run_android_smoke.sh'
      - '.github/scripts/fetch_satoshi.py'
      - 'app/lib/**/*.dart'
      - 'app/android/**'
      - 'app/assets/**'
      - 'app/pubspec.yaml'
      - 'app/pubspec.lock'
      - 'app/l10n.yaml'
      - 'app/integration_test/**/*.dart'

concurrency:
  group: android-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Android launch smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 29, 35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: app/android/**/*.gradle*

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install locked Flutter dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Fetch licensed Satoshi font
        run: python3 .github/scripts/fetch_satoshi.py

      - name: Enable KVM on Linux runners
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch Android emulator and verify welcome screen
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/android-smoke
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio
            -no-boot-anim -no-snapshot-load -no-snapshot-save
            -camera-back none -camera-front none
          script: bash .github/scripts/run_android_smoke.sh

      - name: Upload smoke diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-diagnostics-api-${{ matrix.api-level }}
          path: ${{ runner.temp }}/android-smoke/
          if-no-files-found: warn
          retention-days: 7
