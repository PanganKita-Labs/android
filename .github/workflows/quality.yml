name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: app

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: |
          dart format --output=write .
          git diff --exit-code -- .

  analyzer:
    name: Flutter analyzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Fetch licensed Satoshi font
        run: python3 ../.github/scripts/fetch_satoshi.py

      - name: Run strict Flutter analyzer
        run: flutter analyze --fatal-infos --fatal-warnings

  dcl:
    name: Dart Code Linter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Dart Code Linter
        run: >
          dart run dart_code_linter:metrics analyze
          --reporter=github
          --fatal-style
          --fatal-performance
          --fatal-warnings
          lib

      - name: Check unused Dart code
        run: >
          dart run dart_code_linter:metrics
          check-unused-code
          --analyze-private-members
          lib

      - name: Check unused Dart files
        run: >
          dart run dart_code_linter:metrics
          check-unused-files
          lib

      - name: Check unnecessary nullable parameters
        run: >
          dart run dart_code_linter:metrics
          check-unnecessary-nullable
          lib

  complexity:
    name: Complexity (Dartrics strict)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Enforce zero Dartrics violations
        run: dart run dartrics analyze --snapshot none --strict-dismiss --fatal-warnings lib

  documentation:
    name: API documentation and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Validate Dart API documentation
        run: dart doc --dry-run .

      - name: Validate maintained Python syntax
        working-directory: .
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          paths = sorted(Path("app/tool").glob("*.py"))
          paths += sorted(Path(".github/scripts").glob("*.py"))
          for path in paths:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              print(f"Validated {path}")
          print(f"Parsed {len(paths)} Python source files")
          PY

  tests:
    name: Flutter tests (coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version

      - name: Fetch licensed Satoshi font
        run: python3 ../.github/scripts/fetch_satoshi.py

      - name: Run tests with coverage
        run: flutter test --coverage

  quality:
    name: Quality gate
    if: ${{ always() }}
    needs:
      - formatting
      - analyzer
      - dcl
      - complexity
      - documentation
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        working-directory: .
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          ANALYZER_RESULT: ${{ needs.analyzer.result }}
          DCL_RESULT: ${{ needs.dcl.result }}
          COMPLEXITY_RESULT: ${{ needs.complexity.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          failed=0
          for entry in \
            "Formatting:$FORMATTING_RESULT" \
            "Flutter analyzer:$ANALYZER_RESULT" \
            "Dart Code Linter:$DCL_RESULT" \
            "Complexity:$COMPLEXITY_RESULT" \
            "API documentation:$DOCUMENTATION_RESULT" \
            "Flutter tests:$TESTS_RESULT"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              echo "::error title=Quality gate::$name finished with '$result'; required 'success'."
              failed=1
            fi
          done
          exit "$failed"
