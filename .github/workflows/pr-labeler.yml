name: PR Labeler

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, ready_for_review]

# Metadata-only workflow: never checkout or run code from a pull request.
permissions:
  pull-requests: write

concurrency:
  group: pr-labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply type and area labels
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Label from trusted event metadata and changed paths
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          # Only fixed label names are ever sent to the API.
          managed=(
            type:feat type:fix type:docs type:style type:refactor
            type:perf type:test type:chore type:ci type:build type:research
            area:app area:android area:backend area:ci area:docs
            area:i18n area:tests area:discovery area:merchants
            area:messaging area:notifications area:onboarding
            area:orders area:profile area:shopping area:research
          )
          desired=()
          wants() {
            local label
            for label in "${desired[@]}"; do
              [[ "$label" == "$1" ]] && return 0
            done
            return 1
          }
          add() { wants "$1" || desired+=("$1"); }

          title_pattern='^([A-Za-z]+)(\([^)]*\))?(!)?:[[:space:]]+'
          if [[ "$PR_TITLE" =~ $title_pattern ]]; then
            case "${BASH_REMATCH[1],,}" in
              feat|fix|docs|style|refactor|perf|test|chore|ci|build|research)
                add "type:${BASH_REMATCH[1],,}" ;;
            esac
          fi

          files="$(gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            [[ "$path" == app/test/* || "$path" == app/integration_test/* ]] && add area:tests
            case "$path" in
              .github/workflows/*|.github/scripts/*|.github/dependabot.yml|app/tool/*) add area:ci ;;
            esac
            case "$path" in
              docs/*|README.md|app/README.md|backend/README.md|.github/PULL_REQUEST_TEMPLATE.md) add area:docs ;;
            esac
            case "$path" in
              app/android/*) add area:android ;;
              backend/*) add area:backend ;;
              research/*) add area:research ;;
            esac
            case "$path" in
              app/lib/i18n/*|app/l10n.yaml|app/test/i18n/*|app/tool/check_i18n.py|app/tool/test_check_i18n.py|app/tool/i18n_exceptions.json) add area:i18n ;;
            esac
            case "$path" in
              app/lib/app/*|app/lib/shared/*|app/lib/main.dart|app/pubspec.yaml) add area:app ;;
              app/lib/features/discovery/*|app/test/features/discovery/*) add area:discovery ;;
              app/lib/features/merchants/*|app/test/features/merchants/*) add area:merchants ;;
              app/lib/features/messaging/*|app/test/features/messaging/*) add area:messaging ;;
              app/lib/features/notifications/*|app/test/features/notifications/*) add area:notifications ;;
              app/lib/features/onboarding/*|app/test/features/onboarding/*) add area:onboarding ;;
              app/lib/features/orders/*|app/test/features/orders/*) add area:orders ;;
              app/lib/features/profile/*|app/test/features/profile/*) add area:profile ;;
              app/lib/features/shopping/*|app/test/features/shopping/*) add area:shopping ;;
            esac
          done <<< "$files"

          current="$(gh api --paginate "repos/$GH_REPO/issues/$PR_NUMBER/labels?per_page=100" --jq '.[].name')"
          for label in "${managed[@]}"; do
            if grep -Fxq "$label" <<< "$current" && ! wants "$label"; then
              gh api -X DELETE "repos/$GH_REPO/issues/$PR_NUMBER/labels/$label" >/dev/null
            fi
          done
          for label in "${desired[@]}"; do
            if grep -Fxq "$label" <<< "$current"; then
              continue
            fi
            if ! gh api "repos/$GH_REPO/labels/$label" >/dev/null 2>&1; then
              case "$label" in
                type:feat) color='0e8a16'; description='New application feature or capability' ;;
                type:fix) color='d73a4a'; description='Bug fix or behavior correction' ;;
                type:docs) color='0075ca'; description='Documentation and source-code comments' ;;
                type:refactor) color='8250df'; description='Internal restructuring without intended behavior changes' ;;
                type:test) color='008b8b'; description='Automated tests and test infrastructure' ;;
                type:ci) color='1d76db'; description='Continuous integration and automation changes' ;;
                type:perf) color='b08800'; description='Performance or resource-efficiency improvement' ;;
                type:build) color='c27c0e'; description='Build configuration and tooling' ;;
                type:chore) color='6b7280'; description='Repository maintenance and housekeeping' ;;
                type:style) color='ad6ad8'; description='Formatting or visual style changes' ;;
                type:research) color='c45883'; description='Research and experimental validation' ;;
                area:android) color='3ddc84'; description='Android platform configuration and integration' ;;
                area:app) color='68798f'; description='Application composition, shared UI, and app-wide state' ;;
                area:ci) color='1d76db'; description='GitHub Actions, automation, and developer tooling' ;;
                area:tests) color='008b8b'; description='Unit, widget, and integration tests' ;;
                area:i18n) color='c17c26'; description='Localization, translations, and language support' ;;
                area:docs) color='0075ca'; description='Project documentation and contribution guidance' ;;
                area:onboarding) color='9b59b6'; description='Welcome, authentication UI, and account recovery' ;;
                area:discovery) color='0e8a16'; description='Food discovery, search, and product presentation' ;;
                area:merchants) color='25a18e'; description='Merchant profiles, maps, and store information' ;;
                area:shopping) color='db6d28'; description='Cart, checkout, and payment preview flows' ;;
                area:orders) color='b35b20'; description='Order previews, pickup, and review flows' ;;
                area:profile) color='8066b4'; description='User profile, settings, and favorites' ;;
                area:messaging) color='2a8dc1'; description='Chat, conversations, and support UI' ;;
                area:notifications) color='c45883'; description='Notifications and notification interactions' ;;
                area:backend) color='596b80'; description='Backend and server-related files' ;;
                area:research) color='8a789d'; description='Research documents and experimental materials' ;;
                *) echo "Unknown managed label: $label" >&2; exit 1 ;;
              esac
              gh api -X POST "repos/$GH_REPO/labels" \
                -f "name=$label" -f "color=$color" -f "description=$description" >/dev/null
            fi
            gh api -X POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" \
              -f "labels[]=$label" >/dev/null
          done
          printf 'Applied labels: %s\n' "${desired[*]}"
