name: pangankita
description: A Flutter application for time-sensitive redistribution of eligible unsold food in Indonesia.
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  dart_code_linter: 4.3.0
  dartrics: 1.4.0
  flutter_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-primary.png
    - assets/prototype/
    - assets/fonts/OFL.txt
    - assets/fonts/Satoshi-FFL.txt
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
    - family: Liberation Sans
      fonts:
        - asset: assets/fonts/LiberationSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/LiberationSans-Bold.ttf
          weight: 700
