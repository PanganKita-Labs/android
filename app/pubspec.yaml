name: pangankita
description: A Flutter application for time-sensitive redistribution of eligible unsold food in Indonesia.
publish_to: 'none'

version: 0.1.0-beta.1+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.5.6

dev_dependencies:
  dart_code_linter: 4.4.4
  dartrics: 1.6.1
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: 11.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/brand/logo-primary.png
    - assets/prototype/
    - assets/fonts/Geist-OFL.txt
    - assets/fonts/Satoshi-FFL.txt
  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
